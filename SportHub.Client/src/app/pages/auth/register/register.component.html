<main class="auth-page">
  <section class="auth-panel">
    <h1>SportHub</h1>
    <h2>Create account</h2>

    <form (ngSubmit)="register()">
      <label>
        Name
        <input type="text" name="name" [(ngModel)]="name">
      </label>

      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email">
      </label>

      <label>
        Phone number
        <input type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="Example: 01012345678">
      </label>

      <label>
        Password
        <span class="password-field">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password">
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </span>
      </label>

      <label>
        Confirm password
        <span class="password-field">
          <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword">
          <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </span>
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <p>
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>
  </section>
</main>
